name: ET-VISUAL-02 portrait thumb zones T2 Chrome QA (unapproved)
on:
  push:
    branches: [feat/art-quality-p0-evidence-20261020]
    paths:
      - .github/workflows/et-visual-touch-t2.yml
      - tools/art_quality_pilot/experiments/et_visual_01/touch_t2/**
permissions:
  contents: read
jobs:
  touch-qa:
    name: Frozen R2 -> T1 input -> T2 portrait thumb zones
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout test-only code
        uses: actions/checkout@v4
      - name: Checkout frozen Echo Tide (read-only)
        uses: actions/checkout@v4
        with:
          repository: siskosun/echo-tide
          ref: 38b9daa1adf78002c8ec5349c269a4ce31959d8f
          path: _trial_echo
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild exactly selected R2 and verify frozen artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _trial_echo rev-parse HEAD)" = 38b9daa1adf78002c8ec5349c269a4ce31959d8f
          npm ci --prefix _trial_echo
          node tools/art_quality_pilot/experiments/et_visual_01/r2/apply_r2.mjs _trial_echo
          npm run build --prefix _trial_echo
          echo 'd7eb284f748f6ff258ba17d7cc02f2e465dc4a5f35603d9c454cd3aeac080136  _trial_echo/dist/index.html' | sha256sum -c -
          echo '6e00ce0e34fe5202a90540a29731cc435df42bad72b8bea7319c01cdf9d84de3  _trial_echo/dist/assets/index-BIiMG_uM.js' | sha256sum -c -
      - name: Add reversible T1 touch input to selected R2
        shell: bash
        run: |
          set -euo pipefail
          node tools/art_quality_pilot/experiments/et_visual_01/touch_t1/apply_touch.mjs _trial_echo --already-r2
          test -z "$(git -C _trial_echo diff --name-only -- src/game.js src/levels.js src/route_fork.js src/airborne_bridge.js)"
          echo '362bb613fbc3d5ad4e61f26910aab08146eab2cbc63cc491e7d8df026483ec0f  _trial_echo/src/render.js' | sha256sum -c -
          test -f _trial_echo/src/touch_controls.js
      - name: Reconfigure portrait touch zones on top of verified T1
        shell: bash
        run: |
          set -euo pipefail
          node tools/art_quality_pilot/experiments/et_visual_01/touch_t2/apply_t2.mjs _trial_echo --already-t1
          test -z "$(git -C _trial_echo diff --name-only -- src/game.js src/levels.js src/route_fork.js src/airborne_bridge.js)"
          echo '362bb613fbc3d5ad4e61f26910aab08146eab2cbc63cc491e7d8df026483ec0f  _trial_echo/src/render.js' | sha256sum -c -
      - name: Headless game and touch input unit tests
        shell: bash
        run: |
          set -euo pipefail
          npm test --prefix _trial_echo
          node tools/art_quality_pilot/experiments/et_visual_01/r2/r2_semantics.mjs _trial_echo
          node --test tools/art_quality_pilot/experiments/et_visual_01/touch_t1/tests/touch_controls.test.mjs
          npm run build --prefix _trial_echo
      - name: Prepare Chrome runner and Chinese font
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/et-touch-playwright" artifacts/et-touch-t2
          npm install --prefix "$RUNNER_TEMP/et-touch-playwright" --no-save --ignore-scripts playwright@1.56.1
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match -f '%{family} | %{file}\n' 'Noto Sans CJK SC' > artifacts/et-touch-t2/fontconfig.txt
      - name: Run true touch events through mobile Chrome compositor
        shell: bash
        env:
          TOUCH_QA_SOURCE: _trial_echo
          TOUCH_QA_OUTPUT: artifacts/et-touch-t2
          TOUCH_QA_ORIGIN: http://127.0.0.1:8765
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory _trial_echo/dist > "$RUNNER_TEMP/et-touch-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 0.3
          done
          TOUCH_QA_PLAYWRIGHT="$RUNNER_TEMP/et-touch-playwright" node tools/art_quality_pilot/experiments/et_visual_01/touch_t2/capture_t2.mjs
      - name: Freeze exact QA-tested playable build
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync,cpSync} from 'node:fs';
          const r=JSON.parse(readFileSync('artifacts/et-touch-t2/touch-qa-report.json','utf8'));
          if(!r.passed || r.viewports.length!==5 || r.viewports.some(v=>!v.passed))throw Error('Touch QA was not fully verified');
          if(r.viewports.some(v=>v.emulatedTouch && !v.input))throw Error('Mobile touch interaction was not exercised');
          cpSync('_trial_echo/dist','artifacts/et-touch-t2/playable-dist',{recursive:true});
          cpSync('_trial_echo/visual-eval/touch-t1-lineage.json','artifacts/et-touch-t2/touch-t1-lineage.json');
          cpSync('_trial_echo/visual-eval/touch-t2-lineage.json','artifacts/et-touch-t2/touch-t2-lineage.json');
          console.log('T2 exact build preserved for manual preview (not approved)');
          NODE
      - name: Preserve tests, screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: et-visual-02-touch-t2-evidence
          path: artifacts/et-touch-t2/
          retention-days: 14
          if-no-files-found: warn
