name: Publish stable game-opportunity Skill Release
on:
  push:
    branches: [main]
    paths:
      - 'skills/game-opportunity/VERSION'
permissions:
  contents: read
concurrency:
  group: published-game-opportunity-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Run all offline skill and contract tests
        run: python -m unittest discover -s tests -v
      - name: Install runtime prerequisite for isolated smoke
        run: python -m pip install uv
      - name: Gate release on actual install of exact pinned upstreams
        env:
          GH_TOKEN: ${{ github.token }}
        run: python dev/live_bundle_smoke.py --harness codex --confirm-ephemeral-network-install
      - name: Build only the approved Skill runtime
        run: python dev/build_skill_zip.py
      - name: Validate semver and runtime ZIP
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < skills/game-opportunity/VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid semantic version' >&2; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          version = Path('skills/game-opportunity/VERSION').read_text(encoding='utf-8').strip()
          lock = json.loads(Path('skills/game-opportunity/compatibility.lock.json').read_text(encoding='utf-8'))
          assert lock['bundle_version'] == version
          with ZipFile('dist/skill.zip') as z:
              assert z.testzip() is None
              assert [n for n in z.namelist() if n.endswith('/SKILL.md')] == ['game-opportunity/SKILL.md']
          PY
      - name: Publish exact tested commit, never move existing tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < skills/game-opportunity/VERSION)"
          tag="v${version}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; refusing to replace or retarget." >&2
            exit 1
          fi
          gh release create "${tag}" dist/skill.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${tag}" \
            --notes "Stable source and Skill artifact from tested commit ${GITHUB_SHA}. Exact released game-exp/H5/Godot tags pass an ephemeral four-Skill installation smoke; project Doctor, user-host integration and real player outcomes remain untested."
